name: SystemMonitor
options:
  bundleIdPrefix: se.lab37.systemmonitor
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: 4D2U237VRC
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Bark Dev"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Xcode 15+'s split debug dylib gets a different Team ID than the main
    # binary when signed with a self-signed cert. Disabled so Debug can launch.
    ENABLE_DEBUG_DYLIB: NO
  configs:
    Debug:
      # Hardened runtime + self-signed "Bark Dev" + third-party frameworks
      # (Sparkle) = Team ID mismatch at load time. Off for Debug, on for Release.
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      # The Developer ID cert exists in the login keychain; Sparkle refuses to
      # apply an update that isn't codesigned by a trusted identity, so Release
      # must not fall back to the self-signed "Bark Dev".
      CODE_SIGN_IDENTITY: "Developer ID Application"

targets:
  SystemMonitor:
    type: application
    platform: macOS
    sources:
      - SystemMonitor
    dependencies:
      - package: Sparkle
    info:
      path: SystemMonitor/Info.plist
      properties:
        LSUIElement: YES
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© LAB37"
        CFBundleDisplayName: System Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUEnableInstallerLauncherService: NO
        SUFeedURL: https://delarc0.github.io/system-monitor/appcast.xml
        SUPublicEDKey: "REPLACE_WITH_SPARKLE_PUBLIC_KEY"
        # The feed isn't hosted and the key above is a placeholder, so an
        # automatic check would prompt the user and then fetch a 404 on every
        # launch. Flip to YES with the first real signed release.
        SUEnableAutomaticChecks: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.lab37.systemmonitor.mac
        CODE_SIGN_ENTITLEMENTS: SystemMonitor/SystemMonitor.entitlements
        # Ships as "System Monitor.app" so Finder, the Dock and Spotlight all
        # agree with CFBundleDisplayName. The target and scheme stay
        # "SystemMonitor", so build commands are unchanged.
        PRODUCT_NAME: System Monitor
        # The space would otherwise become "System_Monitor" as the module name.
        PRODUCT_MODULE_NAME: SystemMonitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SystemMonitorTests

  SystemMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SystemMonitorTests
    dependencies:
      - target: SystemMonitor
    settings:
      base:
        # XcodeGen derives the host from the target name, which lacks the space.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/System Monitor.app/Contents/MacOS/System Monitor"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
